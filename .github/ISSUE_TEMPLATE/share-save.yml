name: Share a save file
description: Post an exported RNGdle 10 save for others to load.
title: "Save: "
labels: ["save file"]
body:
  - type: markdown
    attributes:
      value: |
        Saves are easier to browse in [Discussions > Show and tell](https://github.com/gkson-lab/longshot10/discussions/categories/show-and-tell), but posting one here works too.

        In the game, open Settings, find your save under Save files, and press Export. Then drag the `.json` file into the box below.
  - type: textarea
    id: file
    attributes:
      label: Save file
      description: Drag your exported .json file here.
    validations:
      required: true
  - type: input
    id: best
    attributes:
      label: Best roll
      description: Your rarest roll, as the game shows it, for example "Mythic 1/2,400,000 in Exponent mode".
  - type: textarea
    id: notes
    attributes:
      label: Anything else
